<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>记下一个地方 · 城市观察台</title>
    <meta
      name="description"
      content="记下去过的地方和走起来的感觉，生成你自己的小卡。"
    />
    <link rel="icon" href="favicon.svg" />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="record.css" />
    <script type="module" src="js/record.js"></script>
  </head>
  <body>
    <header><a href="./">← 返回试玩</a></header>
    <main class="quick-record">
      <h1>记下一个地方</h1>
      <p id="record-message" role="status"></p>
      <a id="legacy" href="desk.html" hidden>打开已有的完整观察记录 →</a>
      <form id="quick-form" novalidate>
        <label for="place">你去了哪里？</label
        ><input
          id="place"
          name="place"
          maxlength="200"
          autocomplete="off"
          required
        /><label for="feeling">走起来是什么感觉？</label
        ><textarea
          id="feeling"
          name="feeling"
          maxlength="10000"
          required
        ></textarea
        ><button class="primary" type="submit">生成我的小卡</button>
      </form>
      <div id="small-cards" aria-live="polite"></div>
      <div id="after-card" hidden>
        <p>记好了，到这里就可以结束。内容只留在当前浏览器里。</p>
        <button id="another">再记一个地方</button>
        <div id="compare-link"></div>
      </div>
    </main>
  </body>
</html>
