<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>记录我走过的地方 · 城市观察台</title>
    <meta
      name="description"
      content="画下自己的路线，点选感受，留下我的逛街路线。"
    />
    <link rel="icon" href="favicon.svg" />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="record.css" />
    <script type="module" src="js/record.js"></script>
  </head>
  <body>
    <header><a href="./">← 返回试玩</a></header>
    <main class="route-record">
      <h1>记录我走过的地方</h1>
      <p id="record-message" role="status"></p>
      <form id="place-form" novalidate>
        <label for="place">你去了哪里？</label
        ><input
          id="place"
          maxlength="200"
          required
          placeholder="商场或街区名称"
        />
        <details>
          <summary>基本信息（可选）</summary>
          <label>城市<input id="city" maxlength="200" /></label
          ><label
            >空间类型<select id="type">
              <option>商场</option>
              <option>街区</option>
              <option>商业综合体</option>
              <option>其他</option>
            </select></label
          ><label>观察日期<input id="date" type="date" /></label>
        </details>
        <button class="primary" type="submit">开始画路线</button>
      </form>
      <section id="editor" hidden>
        <h2 id="editing-name"></h2>
        <p class="hint">自己的路线示意，不代表测量尺寸。</p>
        <div class="mode-tools">
          <button id="draw-mode" aria-pressed="true">画路线</button
          ><button id="mark-mode" aria-pressed="false">加感受（可跳过）</button>
        </div>
        <div id="feelings" hidden></div>
        <p id="canvas-hint">点空白处添加节点，拖动编号调整位置。</p>
        <svg
          id="record-canvas"
          viewBox="0 0 800 500"
          role="group"
          aria-label="我的路线画布"
          tabindex="0"
        ></svg>
        <div id="node-tools"></div>
        <details>
          <summary>不用拖拽，调整节点</summary>
          <div id="accessible-nodes"></div>
        </details>
        <div id="marker-list"></div>
        <button id="finish" class="primary">完成路线记录</button>
      </section>
      <section id="result" hidden aria-live="polite"></section>
      <div id="saved-records"></div>
      <details class="advanced">
        <summary>以前的记录与进阶工具</summary>
        <a href="desk.html">打开原完整观察工具 →</a
        ><button id="advanced-record" hidden>打开本条路线的进阶工具</button>
        <p class="hint">
          完整笔记、详细两地对照与备份导出在这里，已有数据保留。
        </p>
        <div id="old-cards"></div>
      </details>
    </main>
  <script type="module" src="js/cloud-city.js"></script>
</body>
</html>
